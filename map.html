  ];

  var map = null, markers = [], curCat = 'schools';

  function build() {
    map = L.map('map', { zoomControl: true, scrollWheelZoom: false, attributionControl: true })
      .setView([19.1330, 72.8330], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(map);

    L.marker(SITE, { icon: L.divIcon({ className: '', iconSize: [17, 17], iconAnchor: [8, 8],
      html: '<a class="site" href="' + DIRECTIONS + '" target="_blank" rel="noopener noreferrer" title="Get directions to ESTO Arkis"><u></u><em></em><s></s><i></i><span>ESTO Arkis</span></a>' }), zIndexOffset: 1200, keyboard: false })
      .addTo(map);

    markers = POINTS.map(function (p) {
      var m = L.marker([p[2], p[3]], {
        icon: L.divIcon({ className: '', iconSize: [9, 9], iconAnchor: [4, 4],
          html: '<span class="pin"><i></i><b>' + p[1] + '</b></span>' }),
        title: p[1], alt: p[1]
      }).addTo(map);
      m._cat = p[0];
      return m;
    });
    map.invalidateSize(true);
    setCat(curCat);
  }

  function setCat(cat) {
    curCat = cat;
    if (!map) return;
    markers.forEach(function (m) {
      var el = m.getElement() && m.getElement().querySelector('.pin');
      if (!el) return;
      var on = m._cat === cat;
      el.className = 'pin ' + (on ? 'on' : 'off');
      m.setZIndexOffset(on ? 500 : 0);
    });
    var pts = markers.filter(function (m) { return m._cat === cat; }).map(function (m) { return m.getLatLng(); });
    if (pts.length) map.fitBounds(L.latLngBounds(pts.concat([L.latLng(SITE)])).pad(0.28), { animate: true, duration: 1.1 });
    declutter();
    map.off('zoomend moveend', declutter).on('zoomend moveend', declutter);
  }

  // no two labels may overlap; the ESTO Arkis chip always wins
  function declutter() {
    var pad = 3;
    var taken = [];
    var siteChip = document.querySelector('.site span');
    if (siteChip) {
      var sr = siteChip.getBoundingClientRect();
      taken.push([sr.left - pad, sr.top - pad, sr.right + pad, sr.bottom + pad]);
    }
    var labels = Array.prototype.slice.call(document.querySelectorAll('.pin.on b'));
    labels.forEach(function (b) { b.style.visibility = 'visible'; b.style.left = '15px'; b.style.right = 'auto'; b.style.textAlign = 'left'; b.style.top = '-6px'; });
    function clash(box) {
      return taken.some(function (q) {
        return box[0] < q[2] && box[2] > q[0] && box[1] < q[3] && box[3] > q[1];
      });
    }
    function boxOf(b) {
      var r = b.getBoundingClientRect();
      return [r.left - pad, r.top - pad, r.right + pad, r.bottom + pad];
    }
    // right, left, then lifted / dropped variants — hide only if nothing fits
    var spots = [
      { left: '15px', right: 'auto', align: 'left', top: '-6px' },
      { left: 'auto', right: '15px', align: 'right', top: '-6px' },
      { left: '15px', right: 'auto', align: 'left', top: '-24px' },
      { left: 'auto', right: '15px', align: 'right', top: '-24px' },
      { left: '15px', right: 'auto', align: 'left', top: '12px' },
      { left: 'auto', right: '15px', align: 'right', top: '12px' },
      { left: '15px', right: 'auto', align: 'left', top: '-46px' },
      { left: 'auto', right: '15px', align: 'right', top: '-46px' },
      { left: '15px', right: 'auto', align: 'left', top: '30px' },
      { left: 'auto', right: '15px', align: 'right', top: '30px' }
    ];
    labels.forEach(function (b) {
      var placed = false;
      for (var i = 0; i < spots.length && !placed; i++) {
        var s = spots[i];
        b.style.left = s.left; b.style.right = s.right; b.style.textAlign = s.align; b.style.top = s.top;
        var box = boxOf(b);
        if (!clash(box)) { taken.push(box); placed = true; }
      }
      if (!placed) {
        b.style.left = '15px'; b.style.right = 'auto'; b.style.textAlign = 'left'; b.style.top = '-6px';
        b.style.visibility = 'hidden';
      }
    });
  }

  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'arkis-map-cat' && typeof d.cat === 'string') setCat(d.cat);
  });

  // the map must NOT be constructed before its container has a real size,
  // or Leaflet's internal size and pane origin stay poisoned for good
  var lastW = 0, lastH = 0;
  function tick() {
    var el = document.getElementById('map');
    var w = el.clientWidth, h = el.clientHeight;
    if (!w || !h) return;
    if (!map) { build(); lastW = w; lastH = h; return; }
    if (Math.abs(w - lastW) < 2 && Math.abs(h - lastH) < 2) return;
    lastW = w; lastH = h;
    map.invalidateSize(true);
    setCat(curCat);
  }
  if (window.ResizeObserver) new ResizeObserver(tick).observe(document.getElementById('map'));
  if (window.IntersectionObserver) {
    new IntersectionObserver(function (es) {
      es.forEach(function (x) { if (x.isIntersecting) tick(); });
    }, { threshold: 0.05 }).observe(document.getElementById('map'));
  }
  // one-shot triggers can all be missed (offscreen iframe, throttled timers,
  // a container still measuring 0 while the parent streams) — poll until built
  var poll = setInterval(function () { tick(); if (map) clearInterval(poll); }, 300);
  setTimeout(function () { clearInterval(poll); }, 15000);
  window.addEventListener('load', tick);
  window.addEventListener('resize', tick);
  [0, 200, 700, 1600].forEach(function (d) { setTimeout(tick, d); });
</script>


</body></html>
